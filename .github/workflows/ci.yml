# Tests for the Thunderduck JDBC driver, run on every push and pull request.
# No publishing and no secrets: releases are cut from Thunderduck's internal
# source, not from this mirror. See CONTRIBUTING.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test
        run: mvn -B test
